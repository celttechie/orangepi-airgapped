# Dnsmasq configuration for Direct-Attached Orange Pi PXE / Netboot

# Bind only to the specified interface
interface=eth0
bind-dynamic

# DHCP Server configuration
dhcp-range=192.168.42.100,192.168.42.150,255.255.255.0,12h
dhcp-option=option:router,192.168.42.1
dhcp-option=option:dns-server,192.168.42.1,8.8.8.8

# TFTP Server configuration
enable-tftp
tftp-root=/var/tftp

# PXE / Bootfile configuration
# ARM64 EFI and U-Boot PXE targets
dhcp-match=set:arm64-efi,option:client-arch,11
dhcp-match=set:arm32-efi,option:client-arch,10
dhcp-match=set:bios,option:client-arch,0

# Default bootfile (iPXE / Extlinux / U-Boot script)
dhcp-boot=tag:arm64-efi,ipxe-arm64.efi,192.168.42.1
dhcp-boot=boot.scr,192.168.42.1

# Logging
log-queries
log-dhcp
